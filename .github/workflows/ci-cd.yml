name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ============================================================================
  # 1. Code Quality, Linting & Formatting Check
  # ============================================================================
  lint-and-format:
    name: Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Check Code Formatting (Black)
        run: |
          black --check --diff .

      - name: Check Import Ordering (isort)
        run: |
          isort --check-only --diff .

      - name: Lint Codebase with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings. Max complexity 15, max line length 127
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

  # ============================================================================
  # 2. Test Matrix Across Multiple Python Versions with Coverage
  # ============================================================================
  test-matrix:
    name: Test (Python ${{ matrix.python-version }})
    needs: lint-and-format
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run Test Suite with Pytest & Coverage
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term-missing tests/

      - name: Upload Test Coverage Artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage.xml
          retention-days: 14

  # ============================================================================
  # 3. Security Audit & Vulnerability Assessment
  # ============================================================================
  security-audit:
    name: Security & Vulnerability Audit
    needs: lint-and-format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: Run Dependency Vulnerability Audit (pip-audit)
        run: |
          pip-audit -r requirements.txt

      - name: Run Static Application Security Testing (Bandit)
        run: |
          bandit -r . -x ./tests,./.venv,./venv -ll

  # ============================================================================
  # 4. Infrastructure Validation (Terraform)
  # ============================================================================
  infrastructure-validation:
    name: Terraform Infrastructure Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: Terraform Format Check
        run: |
          terraform fmt -check -diff -recursive infra/

      - name: Terraform Init (Backend-less)
        run: |
          terraform -chdir=infra/terraform init -backend=false

      - name: Terraform Validate
        run: |
          terraform -chdir=infra/terraform validate

  # ============================================================================
  # 5. Production Docker Build, Cache & Push to GHCR
  # ============================================================================
  docker-build-push:
    name: Build & Push Docker Image
    needs: [test-matrix, security-audit, infrastructure-validation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-platform emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker Image Metadata & Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Production Container
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
